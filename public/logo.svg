<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="demoGoldGrad" x1="2" y1="4" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A" />
      <stop offset="0.45" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18181B" />
      <stop offset="1" stop-color="#09090B" />
    </linearGradient>
  </defs>

  <!-- Background tile with border -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#F59E0B" stroke-opacity="0.3" />

  <!-- Main Stem of D -->
  <rect x="7" y="6" width="3.5" height="20" rx="1.5" fill="url(#demoGoldGrad)" />

  <!-- Dynamic Curved Arc of D -->
  <path
    d="M10.5 7.5C18 7.5 23.5 10.5 23.5 16C23.5 21.5 18 24.5 10.5 24.5"
    stroke="url(#demoGoldGrad)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Ascending Growth Arrow inside the D -->
  <path
    d="M13 18.5L19 12.5M19 12.5H14.5M19 12.5V17"
    stroke="#FDE68A"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Growth Point -->
  <circle cx="19" cy="12.5" r="1.5" fill="#FFFFFF" />
</svg>
